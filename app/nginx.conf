server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # Vite writes content-hashed filenames into /assets, so a given URL's bytes
  # never change: cache them hard. `=404` matters as much as the caching --
  # without it the SPA fallback below would answer a missing script with
  # index.html and a 200, which the browser reports as
  # "Unexpected token '<'" instead of an honest 404.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The shell must never be cached: it is what points at the hashed assets,
  # so a stale copy after a redeploy would request files that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
