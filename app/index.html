<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopReturn</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      Bengali typography: the editorial ledger design (customer return timeline
      only, see src/app/ledger.css) runs on Georgia, which has no Bengali
      coverage, so Bangla text there would otherwise fall back to whatever
      system sans-serif is installed and break the ledger's serif rhythm.
      Noto Serif Bengali keeps the serif register for prose (see --ledger-serif
      in src/app/ledger.css); Noto Sans Bengali backs the mono stack in case
      Bengali digits ever show up in timestamps or amounts, and also backs the
      rest of the app's Inter UI font (see src/app/styles.css) so Bangla still
      renders correctly everywhere else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
